x-px4-base: &px4-base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - path: .env
      required: false

x-px4-env: &px4-env
  PX4_SYS_AUTOSTART: 10043
  PX4_SIM_MODEL: sihsim_standard_vtol
  # Defaults are the Mt. Baldy summit (alt 3068 m); set real values in the gitignored docker/.env
  PX4_HOME_ALT: ${PX4_HOME_ALT:-3068}

services:
  # Vanguard fleet
  vanguard-1:
    <<: *px4-base
    environment:
      <<: *px4-env
      PX4_INSTANCE: 0
      PX4_HOME_LAT: ${VANGUARD_LAT:-34.288889}
      PX4_HOME_LON: ${VANGUARD_LON:--117.646667}

  # Reaper fleet — 5 km north of Vanguard
  reaper-1:
    <<: *px4-base
    environment:
      <<: *px4-env
      PX4_INSTANCE: 1
      PX4_HOME_LAT: ${REAPER_LAT:-34.333805}
      PX4_HOME_LON: ${REAPER_LON:--117.646667}
